[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --alluredir=allure-results
markers =
    api: API-only tests
    ui: browser UI tests
    smoke: critical smoke
    negative: negative / error-path
    rbac: role-based access
    operator: needs OPERATOR session
    admin: needs ADMIN session
    viewer: needs VIEWER session
    anon: unauthenticated UI
filterwarnings =
    ignore::DeprecationWarning
